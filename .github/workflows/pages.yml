name: Publish BARATÃO TCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css seed.js data-core.js regionals-data.js app.js _site/
          mkdir -p _site/assets
          cp assets/baratao-road-to-laic-logo.png _site/assets/
          mkdir -p _site/imports
          cp imports/latest.json imports/latest-source.json _site/imports/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
